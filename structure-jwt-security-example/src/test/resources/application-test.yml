# ============================================
# 测试环境配置文件
# ============================================
# 用于单元测试和集成测试
# ============================================

structure:
  # Security 框架配置
  security:
    enabled: true
    corsFilterClass: cn.structure.starter.jwt.configuration.CorsFilter
    antMatchers:
      unAuthenticated:
        # 测试环境的白名单接口
        - /api/user/login
        - /test/**
        - /error

  # JWT 认证配置
  jwt:
    # 测试环境使用较短的 token 有效期
    secret: test-secret-key-for-unit-testing-only-do-not-use-in-production
    jwtTokenValidity: 3600

# ============================================
# 测试配置说明
# ============================================
#
# 1. 测试环境特点
#    - 使用较短的 Token 有效期（1小时）
#    - 使用固定的测试密钥
#    - 包含测试专用的白名单路径
#
# 2. 单元测试建议
#    - 使用 @SpringBootTest 进行集成测试
#    - 使用 @MockBean 模拟外部依赖
#    - 使用 @WithMockUser 模拟用户认证
#
# 3. 集成测试建议
#    - 使用 H2 内存数据库
#    - 配置独立的测试数据源
#    - 测试完成后清理测试数据
#
# ============================================

# ============================================
# 测试用例覆盖场景
# ============================================
#
# 1. 认证测试
#    - testUnauthenticatedAccessProtectedResource: 未登录访问受保护资源
#    - testLoginSuccess: 登录成功
#    - testLoginFailure: 登录失败
#    - testWhitelistedEndpointNoAuthRequired: 白名单接口无需认证
#
# 2. Token 有效性测试
#    - testAccessProtectedResourceWithValidToken: 有效 Token 访问
#    - testAccessProtectedResourceWithInvalidToken: 无效 Token 访问
#    - testAccessProtectedResourceWithExpiredToken: 过期 Token 访问
#    - testNoAuthorizationHeader: 无 Authorization 头
#    - testWrongAuthorizationFormat: 错误的 Authorization 格式
#    - testReuseValidToken: 重复使用 Token
#
# 3. 权限测试
#    - testNoPermissionForRegularUser: 普通用户权限不足
#    - testNoPermissionForAdmin: 管理员权限不足
#    - testAccessResourceWithProperRole: 正确权限访问
#
# ============================================

# ============================================
# 测试用户配置
# ============================================
#
# | 用户名 | 密码 | 角色 | 说明 |
# |--------|------|------|------|
# | admin  | 123456 | ROLE_ADMIN | 管理员用户 |
# | user   | 123456 | ROLE_USER | 普通用户 |
#
# ============================================
