server:
  port: 8082

spring:
  application:
    name: basicauth-server-sample
  profiles:
    active: dev
  main:
    allow-circular-references: true

structure:
  security:
    basicauth:
      server:
        enabled: true
        realm: "Basic Auth Demo"
        users:
          admin: admin123
          user: user123

logging:
  level:
    cn.structured: DEBUG
