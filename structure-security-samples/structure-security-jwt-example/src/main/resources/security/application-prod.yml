# ============================================
# 生产环境配置文件
# ============================================
# 重要: 生产环境请务必修改以下配置项
# ============================================

structure:
  # Security 框架配置
  security:
    enabled: true
    # CORS 跨域过滤器类
    corsFilterClass: cn.structured.security.filter.CorsFilter
    antMatchers:
      unAuthenticated:
        # 【根据实际需求调整】不需要认证的接口
        - /health
        - /ready
        # API 文档（生产环境建议禁用或保护）
        # - /doc.html
        # - /swagger-ui/**

  # JWT 认证配置
  jwt:
    # 【必改】JWT 加密密钥
    # 建议使用以下方式生成安全的密钥:
    #   - UUID.randomUUID().toString().replace("-", "")
    #   - openssl rand -base64 32
    # 生产环境建议通过环境变量注入:
    #   secret: ${JWT_SECRET}
    secret: ${JWT_SECRET:CHANGE_THIS_TO_A_SECURE_SECRET_IN_PRODUCTION}

    # Token 有效期（秒）
    # 生产环境建议使用较短的有效期以提高安全性
    # 默认 2 小时
    jwtTokenValidity: 7200

# ============================================
# 生产环境安全建议
# ============================================
#
# 1. 密钥管理
#    - 不要将密钥硬编码在配置文件中
#    - 使用环境变量、Kubernetes Secret 或密钥管理服务
#    - 定期轮换密钥
#
# 2. Token 配置
#    - 使用较短的有效期（建议 1-2 小时）
#    - 考虑实现 Refresh Token 机制
#    - 监控异常的 Token 使用模式
#
# 3. CORS 配置
#    - 生产环境限制允许的源
#    - 不要使用通配符 * 作为 Access-Control-Allow-Origin
#
# 4. HTTPS
#    - 生产环境必须启用 HTTPS
#    - 配置 HSTS
#    - 使用安全的 Cookie 设置
#
# 5. 日志和监控
#    - 记录认证失败事件
#    - 监控异常的登录模式
#    - 设置告警机制
#
# ============================================

# ============================================
# 生产环境部署检查清单
# ============================================
#
# [ ] 修改 JWT 密钥为安全的随机字符串
# [ ] 禁用 Swagger UI 或添加访问控制
# [ ] 配置 HTTPS 和 HSTS
# [ ] 配置正确的 CORS 源
# [ ] 设置监控和告警
# [ ] 配置日志记录
# [ ] 测试故障转移机制
#
# ============================================
